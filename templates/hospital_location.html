<!DOCTYPE html>
<html>
<head>

    <title>Hospital Location</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="hero">

        <h1>🏥 Hospital Location</h1>

        <p>
            Find hospital information based on your location.
        </p>

        <form method="POST" action="/hospital-location">

            <p>
                <label>Enter Your Location</label><br>

                <input type="text"
                       name="location"
                       placeholder="Example: Chennai"
                       required>
            </p>

            <button type="submit" class="btn">
                🔍 Find Hospitals
            </button>

        </form>

        <p>
            <a href="/dashboard">Back to Dashboard</a>
        </p>

        <p>
            <small>
                ⚠️ Hospital information shown in this project is for
                demonstration purposes.
            </small>
        </p>

    </div>

</body>
</html>
