<!DOCTYPE html>
<html>
<head>

    <title>Hospital Location - Skin Allergy Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='cursor.js') }}"></script>      

</head>

<body>

    <div class="patient-page">

        <div class="patient-card">

            <div class="patient-icon">🏥</div>

            <h1>Hospital Location</h1>

            <p class="patient-subtitle">
                Find nearby hospital information based on your location.
            </p>


            <form method="POST" action="/hospital-location">

                <!-- Location -->

                <div class="patient-group">

                    <label>Enter Your Location</label>

                    <input type="text"
                           name="location"
                           placeholder="Example: Madurai"
                           required>

                </div>


                <!-- Find Button -->

                <button type="submit" class="patient-btn">
                    🔍 Find Hospitals
                </button>

            </form>


            <!-- Important Note -->

            <div class="ai-note">

                <strong>Important:</strong>

                <p>
                    Hospital information shown in this project is
                    for demonstration purposes. Please verify the
                    hospital details before visiting.
                </p>

            </div>


            <!-- Back -->

            <p class="dashboard-back">

                <a href="/dashboard">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </div>

</body>
</html>
