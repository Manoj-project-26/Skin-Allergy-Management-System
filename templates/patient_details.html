<!DOCTYPE html>
<html>
<head>

    <title>Patient Details - Skin Allergy Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='cursor.js') }}"></script>

</head>

<body>

    <div class="patient-page">

        <div class="patient-card">

            <div class="patient-icon">✿</div>

            <h1>Patient Details</h1>

            <p class="patient-subtitle">
                Please enter your basic health information.
            </p>

            <form method="POST" action="/patient-details">

                <div class="patient-group">
                    <label>Patient Name</label>
                    <input type="text"
                           name="patient_name"
                           placeholder="Enter patient name"
                           required>
                </div>

                <div class="patient-row">

                    <div class="patient-group">
                        <label>Age</label>
                        <input type="number"
                               name="age"
                               placeholder="Enter age"
                               required>
                    </div>

                    <div class="patient-group">
                        <label>Gender</label>

                        <select name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>

                    </div>

                </div>

                <div class="patient-group">
                    <label>Phone Number</label>
                    <input type="text"
                           name="phone"
                           placeholder="Enter phone number"
                           required>
                </div>

                <div class="patient-group">
                    <label>Address</label>
                    <textarea name="address"
                              placeholder="Enter address"
                              rows="3"
                              required></textarea>
                </div>

                <div class="patient-group">
                    <label>Allergy Symptoms</label>
                    <textarea name="symptoms"
                              placeholder="Describe your skin allergy symptoms"
                              rows="3"
                              required></textarea>
                </div>

                <div class="patient-group">
                    <label>Previous Allergy History</label>
                    <textarea name="allergy_history"
                              placeholder="Enter previous allergy details, if any"
                              rows="3"></textarea>
                </div>

                <button type="submit" class="patient-btn">
                    Save Patient Details
                </button>

            </form>

            <p class="dashboard-back">
                <a href="/dashboard">← Back to Dashboard</a>
            </p>

        </div>

    </div>

</body>
</html>
