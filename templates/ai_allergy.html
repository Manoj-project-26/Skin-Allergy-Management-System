<!DOCTYPE html>
<html>
<head>

    <title>AI Skin Allergy Analysis</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="hero">

        <h1>🤖 AI Skin Allergy Analysis</h1>

        <p>
            Enter your symptoms for a preliminary skin allergy analysis.
        </p>

        <form method="POST" action="/ai-allergy">

            <p>
                <label>Skin Area</label><br>

                <select name="skin_area" required>
                    <option value="">Select Skin Area</option>
                    <option value="Face">Face</option>
                    <option value="Hands">Hands</option>
                    <option value="Legs">Legs</option>
                    <option value="Body">Body</option>
                    <option value="Other">Other</option>
                </select>
            </p>

            <p>
                <label>How long have you had the symptoms?</label><br>

                <input type="text"
                       name="duration"
                       placeholder="Example: 5 days"
                       required>
            </p>

            <p>
                <label>Symptoms</label><br>

                <textarea name="symptoms"
                          placeholder="Example: itching, redness, rash..."
                          rows="5"
                          required></textarea>
            </p>

            <p>
                <label>Additional Information</label><br>

                <textarea name="additional_info"
                          placeholder="Enter any other information"
                          rows="4"></textarea>
            </p>

            <button type="submit" class="btn">
                🔍 Analyze Symptoms
            </button>

        </form>

        <p>
            <a href="/dashboard">Back to Dashboard</a>
        </p>

        <p>
            <small>
                ⚠️ This tool provides preliminary information for
                academic/project purposes and is not a medical diagnosis.
            </small>
        </p>

    </div>

</body>
</html>
