<!DOCTYPE html>
<html>
<head>

    <title>Doctor Suggestion</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="hero">

        <h1>👨‍⚕️ Doctor Suggestion</h1>

        <p>
            Get a basic doctor specialization suggestion based on your skin symptoms.
        </p>

        <form method="POST" action="/doctor-suggestion">

            <p>
                <label>Symptoms</label><br>

                <textarea name="symptoms"
                          placeholder="Example: itching, redness, rash..."
                          rows="5"
                          required></textarea>
            </p>

            <p>
                <label>Skin Problem Duration</label><br>

                <input type="text"
                       name="duration"
                       placeholder="Example: 5 days"
                       required>
            </p>

            <button type="submit" class="btn">
                👨‍⚕️ Get Doctor Suggestion
            </button>

        </form>

        <p>
            <a href="/dashboard">Back to Dashboard</a>
        </p>

        <p>
            <small>
                ⚠️ This suggestion is for academic/project purposes.
                Please consult a qualified healthcare professional.
            </small>
        </p>

    </div>

</body>
</html>
